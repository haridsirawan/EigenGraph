<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EigenGraph — 10D BIM &amp; Structural Analytics</title>
  <meta name="description" content="EigenGraph 10D BIM, Adjusted Redundancy Index (ARI), SVD Kinematic Mechanism Guards, and Structural Graph Analytics Workstation running natively in WebAssembly." />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link data-trunk rel="icon" href="assets/icon.png" />
  <link data-trunk rel="copy-file" href="manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <link data-trunk rel="copy-file" href="assets/icon.png" data-target-path="assets" />
  <link data-trunk rel="rust" data-bin="eigengraph" data-wasm-opt="0" />

  <script>
    (function () {
      const STORAGE_KEY = "eigengraph_vault_state_v1";
      const AUTOSAVE_KEY = "eigengraph_workspace_autosave_v1";
      const DB_NAME = "EigenGraphVaultDB";
      const DB_VERSION = 1;
      let cachedAutosaveJson = "";
      try {
        cachedAutosaveJson = window.localStorage.getItem(AUTOSAVE_KEY) || "";
      } catch (_) {}
      let pendingPickedFileJson = "";
      let activeFileInput = null;
      let activeDirInput = null;
      let dirOverlayEl = null;
      const VAULT_FOLDERS = [
        "Projects", "KnowledgeBase", "Exports", "AI_Context"
      ];

      let state = {
        connected: false,
        guest_mode: false,
        vault_name: "",
        backend: "none",
        fs_supported: typeof window.showDirectoryPicker === "function",
        needs_permission: false,
        busy: false,
        status_msg: "",
        error_msg: "",
        version: 1,
        projects: []
      };

      try {
        const cached = window.localStorage.getItem(STORAGE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && typeof parsed === "object") {
            state = Object.assign(state, parsed, {
              fs_supported: typeof window.showDirectoryPicker === "function",
              busy: false,
              version: (parsed.version || 1) + 1
            });
          }
        }
      } catch (_) {}

      const INLINE_CACHE_LIMIT = 4 * 1024 * 1024;
      const STREAM_CHUNK_BYTES = 8 * 1024 * 1024;
      const HEAD_SLICE_BYTES = 131072;
      const fileCache = new Map();
      const lazyFiles = new Map(); // relPath -> { file, handle, size_bytes, updated_at, head_text }
      let activeDirHandle = null;
      let activeStream = null; // { id, filename, rel_path, mode, file, offset, total_bytes, pendingBuf, pendingLen, eof, fetching }
      let nextStreamId = 1;

      function advanceActiveStream() {
        if (!activeStream || activeStream.fetching || activeStream.pendingBuf || activeStream.eof_consumed) return;
        if (activeStream.offset >= activeStream.total_bytes) {
          activeStream.pendingBuf = new Uint8Array(0);
          activeStream.pendingLen = 0;
          activeStream.eof = true;
          persistSnapshot();
          return;
        }
        const s = activeStream;
        const end = Math.min(s.offset + STREAM_CHUNK_BYTES, s.total_bytes);
        s.fetching = true;
        s.file.slice(s.offset, end).arrayBuffer().then((buf) => {
          if (!activeStream || activeStream.id !== s.id) return;
          const u8 = new Uint8Array(buf);
          s.pendingBuf = u8;
          s.pendingLen = u8.byteLength;
          s.offset = end;
          s.eof = end >= s.total_bytes;
          s.fetching = false;
          persistSnapshot();
        }).catch((err) => {
          if (!activeStream || activeStream.id !== s.id) return;
          s.fetching = false;
          s.error = (err && err.message) ? err.message : String(err);
          activeStream = null;
          state.error_msg = `Stream read failed: ${s.error}`;
          persistSnapshot();
        });
      }

      function startFileStream(file, filename, relPath, mode) {
        activeStream = {
          id: nextStreamId++,
          filename: String(filename || (file && file.name) || "model.ifc"),
          rel_path: String(relPath || ""),
          mode: String(mode || "vault_open"),
          file,
          offset: 0,
          total_bytes: Number(file.size || 0),
          pendingBuf: null,
          pendingLen: 0,
          eof: false,
          eof_consumed: false,
          fetching: false
        };
        state.status_msg = `Streaming '${activeStream.filename}' (${Math.max(1, Math.round(activeStream.total_bytes / (1024 * 1024)))} MB)...`;
        persistSnapshot();
        advanceActiveStream();
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB unavailable in this browser."));
            return;
          }
          const req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains("handles")) db.createObjectStore("handles");
            if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
            if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "path" });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error("IndexedDB open failed."));
        });
      }

      async function idbGet(storeName, key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readonly");
          const req = tx.objectStore(storeName).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbPut(storeName, value, key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readwrite");
          const store = tx.objectStore(storeName);
          const req = key !== undefined ? store.put(value, key) : store.put(value);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbDelete(storeName, key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readwrite");
          const req = tx.objectStore(storeName).delete(key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGetAllFiles() {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("files", "readonly");
          const req = tx.objectStore("files").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbClearFiles() {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("files", "readwrite");
          const req = tx.objectStore("files").clear();
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      function persistSnapshot() {
        state.version = (state.version || 0) + 1;
        state.fs_supported = typeof window.showDirectoryPicker === "function";
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
            connected: state.connected,
            guest_mode: state.guest_mode,
            vault_name: state.vault_name,
            backend: state.backend,
            needs_permission: state.needs_permission,
            status_msg: state.status_msg,
            error_msg: state.error_msg,
            version: state.version,
            projects: state.projects
          }));
        } catch (_) {}
      }

      function extractProjectMeta(relPath, content, modifiedMs) {
        const norm = relPath.replace(/\\/g, "/");
        const base = norm.split("/").pop() || norm;
        const lower = base.toLowerCase();
        const folderPart = norm.includes("/") ? norm.slice(0, norm.lastIndexOf("/")) : "";
        const isProjFolder = norm.startsWith("Projects/");
        const isIfc = lower.endsWith(".ifc");
        const isEigenExt = lower.endsWith(".eigen") || lower.endsWith(".eigen.json");
        const isProjJson =
          isProjFolder &&
          lower.endsWith(".json") &&
          base !== "active_live_project.json" &&
          base !== "_eigengraph_world_index.json";
        if (!isIfc && !isEigenExt && !isProjJson) return null;

        let displayName = base
          .replace(/\.eigen\.json$/i, "")
          .replace(/\.eigen$/i, "")
          .replace(/\.ifc$/i, "")
          .replace(/\.json$/i, "");
        let nodeCount = 0;
        let memberCount = 0;
        if (isIfc) {
          try {
            const head = content.slice(0, HEAD_SLICE_BYTES);
            const projMatch = head.match(/IFCPROJECT\s*\([^,]*,[^,]*,\s*'([^']+)'/i);
            if (projMatch && projMatch[1] && projMatch[1].trim()) {
              displayName = projMatch[1].trim();
            }
            const elemMatches = content.match(/=\s*IFC(?:WALL|WALLSTANDARDCASE|COLUMN|BEAM|SLAB|FOOTING|MEMBER|ROOF|STAIR|DOOR|WINDOW)\s*\(/gi);
            const storeyMatches = content.match(/=\s*IFCBUILDINGSTOREY\s*\(/gi);
            nodeCount = storeyMatches ? storeyMatches.length : 0;
            memberCount = elemMatches ? elemMatches.length : 0;
          } catch (_) {}
          const dt = modifiedMs ? new Date(modifiedMs) : new Date();
          const updatedAt = isNaN(dt.getTime()) ? "Indexed" : dt.toISOString().slice(0, 16).replace("T", " ") + " UTC";
          return {
            name: `${displayName} [IFC]`,
            filename: base,
            rel_path: norm,
            category: folderPart || "IFC Model",
            node_count: nodeCount,
            member_count: memberCount,
            size_bytes: content.length,
            updated_at: updatedAt
          };
        }
        try {
          const parsed = JSON.parse(content);
          if (parsed && typeof parsed === "object" && (parsed.bim_project || typeof parsed.project_name === "string")) {
            if (typeof parsed.project_name === "string" && parsed.project_name.trim()) {
              displayName = parsed.project_name.trim();
            }
            const bim = parsed.bim_project || {};
            const walls = Array.isArray(bim.walls) ? bim.walls.length : 0;
            const cols = Array.isArray(bim.columns) ? bim.columns.length : 0;
            const runs = Array.isArray(bim.runs) ? bim.runs.length : 0;
            const slabs = Array.isArray(bim.slabs) ? bim.slabs.length : 0;
            const footings = Array.isArray(bim.footings) ? bim.footings.length : 0;
            const levels = Array.isArray(bim.levels) ? bim.levels.length : 0;
            const grids = Array.isArray(bim.grid_lines) ? bim.grid_lines.length : 0;
            const extMembers = Array.isArray(parsed.members) ? parsed.members.length : 0;
            const canvasEnts = Array.isArray(parsed.canvas_entities) ? parsed.canvas_entities.length : 0;
            nodeCount = levels + grids + canvasEnts;
            memberCount = walls + cols + runs + slabs + footings + extMembers;
          } else {
            const model = parsed && parsed.model ? parsed.model : parsed;
            if (model && typeof model === "object") {
              if (typeof model.name === "string" && model.name.trim()) displayName = model.name.trim();
              if (Array.isArray(model.nodes)) nodeCount = model.nodes.length;
              else if (model.nodes && typeof model.nodes === "object") nodeCount = Object.keys(model.nodes).length;
              if (Array.isArray(model.elements)) memberCount = model.elements.length;
              else if (Array.isArray(model.members)) memberCount = model.members.length;
              else if (model.elements && typeof model.elements === "object") memberCount = Object.keys(model.elements).length;
              else if (model.members && typeof model.members === "object") memberCount = Object.keys(model.members).length;
            }
          }
        } catch (_) {}

        const dt = modifiedMs ? new Date(modifiedMs) : new Date();
        const updatedAt = isNaN(dt.getTime()) ? "Indexed" : dt.toISOString().slice(0, 16).replace("T", " ") + " UTC";
        return {
          name: displayName,
          filename: base,
          rel_path: norm,
          category: isProjFolder ? "Projects" : "Vault Root",
          node_count: nodeCount,
          member_count: memberCount,
          size_bytes: content.length,
          updated_at: updatedAt
        };
      }

      function rebuildProjectsFromCache() {
        const list = [];
        for (const [relPath, entry] of fileCache.entries()) {
          const meta = extractProjectMeta(relPath, entry.content, entry.updated_at);
          if (meta) list.push(meta);
        }
        for (const [relPath, lazy] of lazyFiles.entries()) {
          if (fileCache.has(relPath)) continue;
          const meta = extractProjectMeta(relPath, lazy.head_text || "", lazy.updated_at);
          if (meta) {
            meta.size_bytes = lazy.size_bytes || meta.size_bytes;
            list.push(meta);
          }
        }
        list.sort((a, b) => a.name.localeCompare(b.name));
        state.projects = list;
      }

      async function writeHandleFile(dirHandle, relPath, textContent) {
        const parts = relPath.split("/").filter(Boolean);
        if (parts.length === 0) return;
        let curr = dirHandle;
        for (let i = 0; i < parts.length - 1; i++) {
          curr = await curr.getDirectoryHandle(parts[i], { create: true });
        }
        const fileHandle = await curr.getFileHandle(parts[parts.length - 1], { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(textContent);
        await writable.close();
      }

      function hideDirPickerOverlay() {
        if (dirOverlayEl && dirOverlayEl.parentNode) {
          dirOverlayEl.parentNode.removeChild(dirOverlayEl);
        }
        dirOverlayEl = null;
      }

      async function ingestDirectoryFileList(fileList) {
        if (!fileList || fileList.length === 0) return;
        state.busy = true;
        state.error_msg = "";
        persistSnapshot();
        try {
          await idbClearFiles();
          fileCache.clear();
          lazyFiles.clear();
          let rootFolder = "";
          let importedCount = 0;
          const now = Date.now();
          for (const file of Array.from(fileList)) {
            const rawRel = (file.webkitRelativePath || file.name || "").replace(/\\/g, "/");
            const parts = rawRel.split("/").filter(Boolean);
            if (!rootFolder && parts.length > 1) {
              rootFolder = parts[0];
            }
            const rel = parts.length > 1 ? parts.slice(1).join("/") : rawRel;
            const lower = rel.toLowerCase();
            if (
              !rel ||
              !(
                lower.endsWith(".eigen") ||
                lower.endsWith(".json") ||
                lower.endsWith(".md") ||
                lower.endsWith(".txt") ||
                lower.endsWith(".csv") ||
                lower.endsWith(".ifc") ||
                lower.endsWith(".xyz") ||
                lower.endsWith(".e2k")
              )
            ) {
              continue;
            }
            if (file.size <= INLINE_CACHE_LIMIT) {
              const text = await file.text();
              fileCache.set(rel, { content: text, updated_at: file.lastModified || now });
              await idbPut("files", { path: rel, content: text, updated_at: file.lastModified || now }).catch(() => {});
            } else {
              const headText = await file.slice(0, HEAD_SLICE_BYTES).text().catch(() => "");
              lazyFiles.set(rel, {
                file,
                handle: null,
                size_bytes: file.size,
                updated_at: file.lastModified || now,
                head_text: headText
              });
            }
            importedCount++;
          }
          rebuildProjectsFromCache();
          const finalName = rootFolder || "Local Browser Vault";
          activeDirHandle = null;
          state.connected = true;
          state.guest_mode = false;
          state.backend = "indexeddb";
          state.vault_name = finalName;
          state.needs_permission = false;
          state.status_msg = `Opened local folder '${finalName}' (${importedCount} files, ${state.projects.length} projects).`;
          await idbPut("meta", { connected: true, backend: "indexeddb", vault_name: finalName }, "vault_meta");
        } catch (err) {
          state.error_msg = (err && err.message) ? err.message : String(err);
        } finally {
          state.busy = false;
          hideDirPickerOverlay();
          persistSnapshot();
        }
      }

      function ensureDirInput() {
        if (activeDirInput) return activeDirInput;
        const inp = document.createElement("input");
        inp.id = "eg_vault_dir_input";
        inp.type = "file";
        inp.setAttribute("webkitdirectory", "");
        inp.setAttribute("directory", "");
        inp.multiple = true;
        inp.style.display = "none";
        document.body.appendChild(inp);
        inp.addEventListener("change", async () => {
          if (inp.files && inp.files.length > 0) {
            hideDirPickerOverlay();
            await ingestDirectoryFileList(inp.files);
          } else {
            showFirefoxFolderOverlay("Empty_Finder_Vault");
            const msgEl = document.getElementById("eg_firefox_overlay_msg");
            if (msgEl) {
              msgEl.textContent = "Empty Finder folder detected (Firefox webkitdirectory ignores empty folders) — create a new Obsidian Vault below or choose a non-empty folder:";
            }
            state.busy = false;
            state.status_msg = "Selected Finder folder appears empty. Name your Vault in the overlay bar or use Create Vault.";
            persistSnapshot();
          }
          inp.value = "";
        });
        inp.addEventListener("cancel", () => {
          hideDirPickerOverlay();
          state.busy = false;
          state.status_msg = "Folder selection cancelled.";
          persistSnapshot();
        });
        activeDirInput = inp;
        return inp;
      }

      function showFirefoxFolderOverlay(requestedName) {
        ensureDirInput();
        hideDirPickerOverlay();
        const bar = document.createElement("div");
        bar.id = "eg_firefox_folder_overlay";
        bar.style.cssText = [
          "position:fixed",
          "left:50%",
          "bottom:78px",
          "transform:translateX(-50%)",
          "z-index:10002",
          "background:rgba(15,19,28,0.96)",
          "border:1px solid rgba(59,130,246,0.55)",
          "border-radius:14px",
          "padding:10px 14px",
          "display:flex",
          "align-items:center",
          "gap:10px",
          "flex-wrap:wrap",
          "max-width:92vw",
          "box-shadow:0 12px 32px rgba(0,0,0,0.5)",
          "font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif",
          "font-size:12.5px",
          "color:#e2e8f0"
        ].join(";");

        const text = document.createElement("span");
        text.id = "eg_firefox_overlay_msg";
        text.textContent = "Browser Vault Folder Picker (Firefox / Safari):";
        text.style.fontWeight = "600";

        const label = document.createElement("label");
        label.htmlFor = "eg_vault_dir_input";
        label.textContent = "Choose Folder in Finder…";
        label.style.cssText = [
          "cursor:pointer",
          "background:#2563eb",
          "color:#ffffff",
          "padding:6px 12px",
          "border-radius:8px",
          "font-weight:600"
        ].join(";");

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = requestedName && requestedName !== "Local Browser Vault" ? requestedName : "EigenGraph_Vault";
        nameInput.placeholder = "Vault Name";
        nameInput.style.cssText = [
          "background:rgba(15,23,42,0.9)",
          "color:#f8fafc",
          "border:1px solid rgba(148,163,184,0.35)",
          "border-radius:8px",
          "padding:5px 8px",
          "font-size:12px",
          "width:140px"
        ].join(";");

        const createBtn = document.createElement("button");
        createBtn.type = "button";
        createBtn.textContent = "Create Obsidian Vault";
        createBtn.style.cssText = [
          "cursor:pointer",
          "background:#16a34a",
          "color:#ffffff",
          "border:none",
          "padding:6px 10px",
          "border-radius:8px",
          "font-size:12px",
          "font-weight:600"
        ].join(";");
        createBtn.onclick = () => {
          hideDirPickerOverlay();
          const nm = (nameInput.value || "EigenGraph_Vault").trim() || "EigenGraph_Vault";
          void createNewVaultAsync(nm, true);
        };

        const idbBtn = document.createElement("button");
        idbBtn.type = "button";
        idbBtn.textContent = "Use Existing Storage";
        idbBtn.style.cssText = [
          "cursor:pointer",
          "background:rgba(148,163,184,0.16)",
          "color:#cbd5e1",
          "border:1px solid rgba(148,163,184,0.3)",
          "padding:6px 10px",
          "border-radius:8px",
          "font-size:12px"
        ].join(";");
        idbBtn.onclick = () => {
          hideDirPickerOverlay();
          void connectIndexedDbVaultAsync(requestedName || "Browser IndexedDB Vault", false);
        };

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.textContent = "Cancel";
        cancelBtn.style.cssText = [
          "cursor:pointer",
          "background:transparent",
          "color:#94a3b8",
          "border:none",
          "padding:6px 8px",
          "font-size:12px"
        ].join(";");
        cancelBtn.onclick = () => {
          hideDirPickerOverlay();
          state.busy = false;
          state.status_msg = "Folder selection closed.";
          persistSnapshot();
        };

        bar.appendChild(text);
        bar.appendChild(label);
        bar.appendChild(nameInput);
        bar.appendChild(createBtn);
        bar.appendChild(idbBtn);
        bar.appendChild(cancelBtn);
        document.body.appendChild(bar);
        dirOverlayEl = bar;
      }

      async function scanDirectoryIntoCache(dirHandle) {
        fileCache.clear();
        lazyFiles.clear();
        const shardDirs = new Set(["Columns", "Beams", "Slabs", "Walls", "Footings", "Rebar"]);
        async function traverse(handle, prefix, depth) {
          if (depth > 6) return;
          try {
            for await (const [name, entry] of handle.entries()) {
              if (!name || name.startsWith(".")) continue;
              const rel = prefix ? `${prefix}/${name}` : name;
              if (entry.kind === "directory") {
                await traverse(entry, rel, depth + 1);
              } else if (entry.kind === "file") {
                const lower = name.toLowerCase();
                if (
                  lower.endsWith(".eigen") ||
                  lower.endsWith(".json") ||
                  lower.endsWith(".txt") ||
                  lower.endsWith(".md") ||
                  lower.endsWith(".csv") ||
                  lower.endsWith(".ifc") ||
                  lower.endsWith(".xyz") ||
                  lower.endsWith(".e2k")
                ) {
                  if (lower.endsWith(".json") && shardDirs.has(prefix) && name !== "active_live_project.json") {
                    continue;
                  }
                  const f = await entry.getFile();
                  if (f.size <= INLINE_CACHE_LIMIT) {
                    const text = await f.text();
                    fileCache.set(rel, { content: text, updated_at: f.lastModified });
                    await idbPut("files", { path: rel, content: text, updated_at: f.lastModified }).catch(() => {});
                  } else {
                    const headText = await f.slice(0, HEAD_SLICE_BYTES).text().catch(() => "");
                    lazyFiles.set(rel, {
                      file: f,
                      handle: entry,
                      size_bytes: f.size,
                      updated_at: f.lastModified,
                      head_text: headText
                    });
                  }
                }
              }
            }
          } catch (_) {}
        }
        await traverse(dirHandle, "", 0);
        rebuildProjectsFromCache();
      }

      async function loadIdbFilesIntoCache() {
        fileCache.clear();
        const rows = await idbGetAllFiles();
        for (const row of rows) {
          if (row && row.path && typeof row.content === "string") {
            fileCache.set(row.path, { content: row.content, updated_at: row.updated_at || Date.now() });
          }
        }
        rebuildProjectsFromCache();
      }

      async function ensureVaultStructureInHandle(dirHandle) {
        for (const f of VAULT_FOLDERS) {
          await dirHandle.getDirectoryHandle(f, { create: true });
        }
      }

      async function connectExistingVaultAsync() {
        state.busy = true;
        state.error_msg = "";
        persistSnapshot();
        try {
          if (typeof window.showDirectoryPicker === "function") {
            const handle = await window.showDirectoryPicker({ id: "eigengraph-vault", mode: "readwrite" });
            activeDirHandle = handle;
            await idbPut("handles", handle, "active_handle");
            await scanDirectoryIntoCache(handle);
            state.connected = true;
            state.guest_mode = false;
            state.backend = "fs_access";
            state.vault_name = handle.name || "Local Vault Folder";
            state.needs_permission = false;
            state.status_msg = `Connected local Vault folder '${state.vault_name}' (${state.projects.length} projects).`;
            await idbPut("meta", { connected: true, backend: "fs_access", vault_name: state.vault_name }, "vault_meta");
          } else {
            const dirInput = ensureDirInput();
            showFirefoxFolderOverlay("Local Browser Vault");
            state.busy = false;
            state.status_msg = "Select your Finder folder via the picker bar (or click 'Use Browser Storage').";
            persistSnapshot();
            try {
              dirInput.click();
            } catch (_) {}
            return;
          }
        } catch (err) {
          if (err && err.name === "AbortError") {
            state.status_msg = "Folder selection cancelled.";
          } else {
            state.error_msg = (err && err.message) ? err.message : String(err);
          }
        } finally {
          state.busy = false;
          persistSnapshot();
        }
      }

      async function connectIndexedDbVaultAsync(vaultName, resetEmpty) {
        state.busy = true;
        state.error_msg = "";
        persistSnapshot();
        try {
          const cleanName = String(vaultName || "Browser IndexedDB Vault").trim() || "Browser IndexedDB Vault";
          if (resetEmpty) {
            await idbClearFiles();
            fileCache.clear();
          } else {
            await loadIdbFilesIntoCache();
          }
          rebuildProjectsFromCache();
          activeDirHandle = null;
          state.connected = true;
          state.guest_mode = false;
          state.backend = "indexeddb";
          state.vault_name = cleanName;
          state.needs_permission = false;
          state.status_msg = `Connected Browser Vault '${cleanName}' (${state.projects.length} projects).`;
          await idbPut("meta", { connected: true, backend: "indexeddb", vault_name: cleanName }, "vault_meta");
        } catch (err) {
          state.error_msg = (err && err.message) ? err.message : String(err);
        } finally {
          state.busy = false;
          persistSnapshot();
        }
      }

      async function createNewVaultAsync(vaultName, forceIndexedDb) {
        state.busy = true;
        state.error_msg = "";
        persistSnapshot();
        const cleanName = String(vaultName || "EigenGraph_Vault").trim() || "EigenGraph_Vault";
        try {
          if (!forceIndexedDb && typeof window.showDirectoryPicker === "function") {
            const handle = await window.showDirectoryPicker({ id: "eigengraph-vault", mode: "readwrite" });
            activeDirHandle = handle;
            await idbPut("handles", handle, "active_handle");
            await ensureVaultStructureInHandle(handle);
            await scanDirectoryIntoCache(handle);
            state.connected = true;
            state.guest_mode = false;
            state.backend = "fs_access";
            state.vault_name = cleanName || handle.name || "EigenGraph Vault";
            state.needs_permission = false;
            state.status_msg = `Created & connected Vault '${state.vault_name}' in local folder '${handle.name}'.`;
            await idbPut("meta", { connected: true, backend: "fs_access", vault_name: state.vault_name }, "vault_meta");
          } else {
            await connectIndexedDbVaultAsync(cleanName, true);
            state.status_msg = `Created Obsidian-style Vault '${cleanName}' (Projects/, KnowledgeBase/, Exports/, AI_Context/).`;
          }
        } catch (err) {
          if (err && err.name === "AbortError") {
            state.status_msg = "Vault folder creation cancelled.";
          } else {
            state.error_msg = (err && err.message) ? err.message : String(err);
          }
        } finally {
          state.busy = false;
          persistSnapshot();
        }
      }

      async function reconnectPermissionAsync() {
        state.busy = true;
        state.error_msg = "";
        persistSnapshot();
        try {
          const handle = activeDirHandle || (await idbGet("handles", "active_handle"));
          if (!handle) {
            state.needs_permission = false;
            state.connected = false;
            state.error_msg = "Saved folder handle missing. Please select your Vault folder again.";
          } else {
            const perm = await handle.requestPermission({ mode: "readwrite" });
            if (perm === "granted") {
              activeDirHandle = handle;
              await scanDirectoryIntoCache(handle);
              state.needs_permission = false;
              state.connected = true;
              state.status_msg = `Reconnected folder '${state.vault_name}' (${state.projects.length} projects).`;
            } else {
              state.error_msg = "Folder write permission was denied by browser.";
            }
          }
        } catch (err) {
          state.error_msg = (err && err.message) ? err.message : String(err);
        } finally {
          state.busy = false;
          persistSnapshot();
        }
      }

      async function refreshScanAsync() {
        state.busy = true;
        persistSnapshot();
        try {
          if (state.backend === "fs_access" && activeDirHandle) {
            await scanDirectoryIntoCache(activeDirHandle);
            state.status_msg = `Refreshed Vault index (${state.projects.length} projects).`;
          } else if (state.backend === "indexeddb") {
            await loadIdbFilesIntoCache();
            state.status_msg = `Refreshed IndexedDB Vault (${state.projects.length} projects).`;
          }
        } catch (err) {
          state.error_msg = (err && err.message) ? err.message : String(err);
        } finally {
          state.busy = false;
          persistSnapshot();
        }
      }

      async function tryImportVaultBundle(filename, text) {
        if (!filename || !filename.toLowerCase().endsWith(".eigen-vault.json")) return false;
        try {
          const bundle = JSON.parse(text);
          if (!bundle || bundle.schema !== "eigengraph-vault-bundle-v1" || !bundle.files || typeof bundle.files !== "object") {
            return false;
          }
          await idbClearFiles();
          fileCache.clear();
          const now = Date.now();
          let count = 0;
          for (const [relPath, content] of Object.entries(bundle.files)) {
            if (typeof content === "string") {
              fileCache.set(relPath, { content, updated_at: now });
              await idbPut("files", { path: relPath, content, updated_at: now }).catch(() => {});
              count++;
            }
          }
          rebuildProjectsFromCache();
          activeDirHandle = null;
          state.connected = true;
          state.guest_mode = false;
          state.backend = "indexeddb";
          state.vault_name = String(bundle.vault_name || "Restored Vault").trim() || "Restored Vault";
          state.needs_permission = false;
          state.status_msg = `Restored Obsidian Vault '${state.vault_name}' (${count} files, ${state.projects.length} projects).`;
          await idbPut("meta", { connected: true, backend: "indexeddb", vault_name: state.vault_name }, "vault_meta");
          persistSnapshot();
          return true;
        } catch (_) {
          return false;
        }
      }

      async function disconnectVaultAsync() {
        hideDirPickerOverlay();
        activeDirHandle = null;
        activeStream = null;
        fileCache.clear();
        lazyFiles.clear();
        await idbDelete("handles", "active_handle").catch(() => {});
        await idbDelete("meta", "vault_meta").catch(() => {});
        state.connected = false;
        state.guest_mode = false;
        state.vault_name = "";
        state.backend = "none";
        state.needs_permission = false;
        state.error_msg = "";
        state.projects = [];
        state.status_msg = "Vault disconnected from browser session.";
        persistSnapshot();
      }

      async function hydrateOnStartup() {
        try {
          const autosaveRec = await idbGet("meta", "workspace_autosave");
          if (autosaveRec && typeof autosaveRec.json === "string" && autosaveRec.json.length > 0) {
            cachedAutosaveJson = autosaveRec.json;
            try { window.localStorage.setItem(AUTOSAVE_KEY, autosaveRec.json); } catch (_) {}
            persistSnapshot();
          }
        } catch (_) {}
        try {
          const meta = await idbGet("meta", "vault_meta");
          if (meta && meta.connected) {
            if (meta.backend === "fs_access") {
              const handle = await idbGet("handles", "active_handle");
              if (handle && typeof handle.queryPermission === "function") {
                const perm = await handle.queryPermission({ mode: "readwrite" });
                activeDirHandle = handle;
                state.connected = true;
                state.backend = "fs_access";
                state.vault_name = meta.vault_name || handle.name || "Local Vault Folder";
                if (perm === "granted") {
                  await scanDirectoryIntoCache(handle);
                  state.needs_permission = false;
                  state.status_msg = `Restored local folder '${state.vault_name}'.`;
                } else {
                  await loadIdbFilesIntoCache();
                  state.needs_permission = true;
                  state.status_msg = "Click 'Reconnect Folder' to resume writing to OS directory.";
                }
                persistSnapshot();
                return;
              }
            } else if (meta.backend === "indexeddb") {
              await loadIdbFilesIntoCache();
              state.connected = true;
              state.backend = "indexeddb";
              state.vault_name = meta.vault_name || "Browser IndexedDB Vault";
              state.needs_permission = false;
              state.status_msg = `Restored Browser IndexedDB Vault '${state.vault_name}'.`;
              persistSnapshot();
              return;
            }
          }
        } catch (_) {}
      }

      window.EigenGraphVaultBridge = {
        getVersion: () => state.version || 1,
        getStateJson: () => JSON.stringify(state),
        connectExistingVault: () => { void connectExistingVaultAsync(); },
        connectIndexedDbVault: (name) => { void connectIndexedDbVaultAsync(name, false); },
        createNewVault: (name, forceIdb) => { void createNewVaultAsync(name, !!forceIdb); },
        downloadVaultBundle: (vaultName) => {
          const clean = String(vaultName || state.vault_name || "EigenGraph_Vault")
            .trim()
            .replace(/[^a-zA-Z0-9._-]+/g, "_");
          const filesObj = {};
          for (const [k, v] of fileCache.entries()) {
            filesObj[k] = v && typeof v.content === "string" ? v.content : "";
          }
          const payload = JSON.stringify(
            {
              schema: "eigengraph-vault-bundle-v1",
              vault_name: state.vault_name || clean,
              exported_at: new Date().toISOString(),
              folders: VAULT_FOLDERS,
              files: filesObj
            },
            null,
            2
          );
          try {
            const blob = new Blob([payload], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${clean}.eigen-vault.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            state.status_msg = `Exported Vault backup '${clean}.eigen-vault.json' (${Object.keys(filesObj).length} files).`;
            persistSnapshot();
          } catch (err) {
            state.error_msg = (err && err.message) ? err.message : String(err);
            persistSnapshot();
          }
        },
        reconnectVault: () => { void reconnectPermissionAsync(); },
        refreshVault: () => { void refreshScanAsync(); },
        disconnectVault: () => { void disconnectVaultAsync(); },
        enterGuestMode: () => {
          state.guest_mode = true;
          state.connected = false;
          state.error_msg = "";
          state.status_msg = "Exploring workspace in Guest Session.";
          persistSnapshot();
        },
        readFileSync: (relPath) => {
          const norm = String(relPath || "").replace(/\\/g, "/");
          const hit = fileCache.get(norm);
          return hit ? hit.content : "";
        },
        readFileSnippetSync: (relPath) => {
          const norm = String(relPath || "").replace(/\\/g, "/");
          const hit = fileCache.get(norm);
          if (hit) return hit.content;
          const lazy = lazyFiles.get(norm);
          return lazy && lazy.head_text ? lazy.head_text : "";
        },
        isFileLazy: (relPath) => {
          const norm = String(relPath || "").replace(/\\/g, "/");
          return lazyFiles.has(norm) && !fileCache.has(norm);
        },
        requestFileAsync: (relPath, mode) => {
          const norm = String(relPath || "").replace(/\\/g, "/");
          const lazy = lazyFiles.get(norm);
          if (!lazy) return false;
          const base = norm.split("/").pop() || norm;
          const resolveFile = async () => {
            try {
              const fileObj = (lazy.handle && typeof lazy.handle.getFile === "function")
                ? await lazy.handle.getFile()
                : lazy.file;
              if (!fileObj) {
                state.error_msg = `Lazy Vault handle missing for '${norm}'.`;
                persistSnapshot();
                return;
              }
              startFileStream(fileObj, base, norm, mode || "vault_open");
            } catch (err) {
              state.error_msg = (err && err.message) ? err.message : String(err);
              persistSnapshot();
            }
          };
          void resolveFile();
          return true;
        },
        pollStreamStateJson: () => {
          if (!activeStream) {
            return JSON.stringify({ active: false });
          }
          advanceActiveStream();
          const s = activeStream;
          return JSON.stringify({
            active: true,
            id: s.id,
            ready: !!s.pendingBuf,
            filename: s.filename,
            rel_path: s.rel_path,
            mode: s.mode,
            loaded_bytes: s.offset,
            total_bytes: s.total_bytes,
            eof: !!s.eof
          });
        },
        takeStreamChunkBytes: () => {
          if (!activeStream || !activeStream.pendingBuf) {
            return new Uint8Array(0);
          }
          const chunk = activeStream.pendingBuf;
          const isEof = !!activeStream.eof;
          activeStream.pendingBuf = null;
          activeStream.pendingLen = 0;
          if (isEof) {
            activeStream.eof_consumed = true;
            state.status_msg = `Loaded '${activeStream.filename}' (${Math.round(activeStream.total_bytes / 1024)} KB).`;
            activeStream = null;
            persistSnapshot();
          } else {
            advanceActiveStream();
          }
          return chunk;
        },
        writeFileAsync: (relPath, content) => {
          const norm = String(relPath || "").replace(/\\/g, "/");
          const now = Date.now();
          lazyFiles.delete(norm);
          fileCache.set(norm, { content: String(content || ""), updated_at: now });
          rebuildProjectsFromCache();
          persistSnapshot();
          void idbPut("files", { path: norm, content: String(content || ""), updated_at: now }).catch(() => {});
          if (state.backend === "fs_access" && activeDirHandle && !state.needs_permission) {
            void writeHandleFile(activeDirHandle, norm, String(content || "")).catch(() => {});
          }
        },
        deleteFileAsync: (relPath) => {
          const norm = String(relPath || "").replace(/\\/g, "/");
          fileCache.delete(norm);
          lazyFiles.delete(norm);
          rebuildProjectsFromCache();
          persistSnapshot();
          void idbDelete("files", norm).catch(() => {});
        },
        saveAutosaveArchive: (json) => {
          const str = String(json || "");
          cachedAutosaveJson = str;
          try { window.localStorage.setItem(AUTOSAVE_KEY, str); } catch (_) {}
          void idbPut("meta", { json: str, updated_at: Date.now() }, "workspace_autosave").catch(() => {});
        },
        loadAutosaveArchive: () => cachedAutosaveJson || "",
        openFilePicker: (accept) => {
          if (!activeFileInput) {
            activeFileInput = document.createElement("input");
            activeFileInput.type = "file";
            activeFileInput.style.display = "none";
            document.body.appendChild(activeFileInput);
            activeFileInput.addEventListener("change", async () => {
              try {
                const file = activeFileInput.files && activeFileInput.files[0];
                if (!file) return;
                if (file.size <= INLINE_CACHE_LIMIT) {
                  const text = await file.text();
                  if (!(await tryImportVaultBundle(file.name, text))) {
                    pendingPickedFileJson = JSON.stringify({ filename: file.name, content: text });
                    state.status_msg = `Imported '${file.name}' (${Math.round(file.size / 1024)} KB).`;
                    persistSnapshot();
                  }
                } else {
                  startFileStream(file, file.name, file.name, "picked_import");
                }
              } catch (err) {
                state.error_msg = (err && err.message) ? err.message : String(err);
                persistSnapshot();
              } finally {
                activeFileInput.value = "";
              }
            });
          }
          activeFileInput.accept = accept || ".ifc,.eigen,.json,.csv,.xyz,.e2k";
          activeFileInput.click();
        },
        pollPickedFileJson: () => {
          const out = pendingPickedFileJson;
          pendingPickedFileJson = "";
          return out || "";
        },
        listCachedFilesJson: () => {
          const items = [];
          for (const [relPath, entry] of fileCache.entries()) {
            const norm = String(relPath || "").replace(/\\/g, "/");
            const parts = norm.split("/");
            const category = parts.length > 1 ? parts[0] : "Vault Root";
            items.push({
              rel_path: norm,
              category,
              size_bytes: entry && typeof entry.content === "string" ? entry.content.length : 0
            });
          }
          for (const [relPath, lazy] of lazyFiles.entries()) {
            const norm = String(relPath || "").replace(/\\/g, "/");
            if (fileCache.has(norm)) continue;
            const parts = norm.split("/");
            const category = parts.length > 1 ? parts[0] : "Vault Root";
            items.push({
              rel_path: norm,
              category,
              size_bytes: Number(lazy.size_bytes || 0)
            });
          }
          items.sort((a, b) => a.rel_path.localeCompare(b.rel_path));
          return JSON.stringify(items);
        },
        saveGeminiKeyOptIn: (remember, apiKey) => {
          try {
            if (remember && apiKey && String(apiKey).trim().length > 0) {
              window.localStorage.setItem("eigengraph_gemini_optin_v1", "1");
              window.localStorage.setItem("eigengraph_gemini_key_v1", String(apiKey).trim());
            } else {
              window.localStorage.removeItem("eigengraph_gemini_optin_v1");
              window.localStorage.removeItem("eigengraph_gemini_key_v1");
            }
          } catch (_) {}
        },
        loadGeminiKeyOptInJson: () => {
          try {
            const optIn = window.localStorage.getItem("eigengraph_gemini_optin_v1") === "1";
            const key = optIn ? (window.localStorage.getItem("eigengraph_gemini_key_v1") || "") : "";
            return JSON.stringify({ remember: optIn, api_key: key });
          } catch (_) {
            return JSON.stringify({ remember: false, api_key: "" });
          }
        }
      };

      window.addEventListener("dragover", (e) => {
        if (e && e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes("Files")) {
          e.preventDefault();
        }
      });
      window.addEventListener("drop", async (e) => {
        if (!e || !e.dataTransfer || !e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
        e.preventDefault();
        try {
          const file = e.dataTransfer.files[0];
          if (file && file.size <= INLINE_CACHE_LIMIT) {
            const text = await file.text();
            if (!(await tryImportVaultBundle(file.name, text))) {
              pendingPickedFileJson = JSON.stringify({ filename: file.name, content: text });
              state.status_msg = `Dropped '${file.name}' (${Math.round(file.size / 1024)} KB).`;
              persistSnapshot();
            }
          } else if (file) {
            startFileStream(file, file.name, file.name, "picked_import");
          }
        } catch (err) {
          state.error_msg = (err && err.message) ? err.message : String(err);
          persistSnapshot();
        }
      });

      void hydrateOnStartup();
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0f1117;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    canvas#eigengraph_canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    #loading_overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #16223a 0%, #0f1117 70%);
      z-index: 9999;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }

    .eg-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(45, 140, 255, 0.2);
      border-top-color: #2d8cff;
      border-radius: 50%;
      animation: eg-spin 0.9s linear infinite;
    }

    @keyframes eg-spin {
      to { transform: rotate(360deg); }
    }

    .eg-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .eg-subtitle {
      font-size: 13px;
      color: #a5b4ca;
      margin: 0;
    }
  </style>
</head>
<body>
  <canvas id="eigengraph_canvas"></canvas>

  <div id="loading_overlay">
    <div class="eg-spinner"></div>
    <h1 class="eg-title">EigenGraph Workstation</h1>
    <p class="eg-subtitle">Loading 10D BIM &amp; Structural Analytics WebAssembly Engine...</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
