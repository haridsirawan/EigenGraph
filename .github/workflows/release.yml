name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build & Publish macOS DMG
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release

      - name: Package macOS App Bundle & DMG
        run: |
          mkdir -p "EigenGraph.app/Contents/MacOS"
          mkdir -p "EigenGraph.app/Contents/Resources"
          cp target/release/eigengraph "EigenGraph.app/Contents/MacOS/"
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png "EigenGraph.app/Contents/Resources/"
          fi
          
          # Create professional staging folder with /Applications symlink
          mkdir -p dmg_staging
          cp -R "EigenGraph.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.0"
          fi
          
          hdiutil create -volname "EigenGraph" -srcfolder "dmg_staging" -ov -format UDZO "EigenGraph-${TAG_NAME}.dmg"
          rm -rf dmg_staging

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "EigenGraph ${{ github.ref_name }}"
          generate_release_notes: true
          files: EigenGraph-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
