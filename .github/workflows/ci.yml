name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            clang \
            libclang-dev \
            llvm-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libwayland-cursor0 \
            libwayland-egl1 \
            libwayland-server0 \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            libgtk-3-dev \
            libasound2-dev \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-cache-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cache-v2-

      - name: Cargo Check
        run: |
          cargo check --verbose 2>&1 | tee cargo_check.log || {
            echo "### ❌ Cargo Check Failed on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 cargo_check.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Core Mechanics & Solver Tests
        run: |
          cargo test --verbose 2>&1 | tee cargo_test.log || {
            echo "### ❌ Cargo Test Failed on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 cargo_test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Core Tests Summary
        if: success()
        run: |
          echo "### ✅ Test Suite Succeeded on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "All core FEM, SVD Kinematic Guard, CPM, and LCA unit tests verified." >> $GITHUB_STEP_SUMMARY

  release-macos:
    name: Build & Publish macOS Release (.dmg)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain & Universal 2 Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build Universal 2 Release Binary (Intel + Apple Silicon)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/eigengraph \
            target/x86_64-apple-darwin/release/eigengraph \
            target/aarch64-apple-darwin/release/eigengraph
          file target/universal/eigengraph

      - name: Package macOS App Bundle & DMG
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "Building EigenGraph Universal 2 macOS bundle version ${VERSION}..."
          mkdir -p "EigenGraph.app/Contents/MacOS"
          mkdir -p "EigenGraph.app/Contents/Resources"
          cp target/universal/eigengraph "EigenGraph.app/Contents/MacOS/"
          chmod +x "EigenGraph.app/Contents/MacOS/eigengraph"
          if [ -f "assets/Info.plist" ]; then
            cp assets/Info.plist "EigenGraph.app/Contents/"
            sed -i '' "s/<string>1.0.0<\/string>/<string>${VERSION}<\/string>/g" "EigenGraph.app/Contents/Info.plist" || true
          fi
          if [ -f "assets/AppIcon.icns" ]; then
            cp assets/AppIcon.icns "EigenGraph.app/Contents/Resources/"
          elif [ -f "assets/icon.png" ]; then
            cp assets/icon.png "EigenGraph.app/Contents/Resources/"
          fi
          codesign --force --deep --sign - "EigenGraph.app"
          mkdir -p target/release
          mkdir -p dmg_staging
          cp -R "EigenGraph.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "EigenGraph" -srcfolder "dmg_staging" -ov -format UDZO target/release/EigenGraph-macOS.dmg
          rm -rf dmg_staging EigenGraph.app

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EigenGraph-macOS-DMG
          path: target/release/EigenGraph-macOS.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          TAG_NAME="v${VERSION}"
          echo "Target Release Tag: ${TAG_NAME}"

          python3 -c '
          notes = """### 🚀 EigenGraph Official Release

          #### 🌟 Highlight Fitur Baru:
          - **💥 Dynamic Cascading Collapse Engine**: Simulasi keruntuhan berantai nonlinier Alternate Path Method sesuai standar DoD UFC 4-023-03 dan ASCE 7-22 dengan Dynamic Amplification Factor (DAF).
          - **⏱️ BIM 4D CPM Erection Scheduling**: Perhitungan otomatis lintasan kritis WBS, float, kurva S mingguan, dan pengamanan stabilitas bertahap Staged Erection SVD Guard.
          - **🌱 BIM 6D Embodied Carbon LCA**: Akuntansi jejak karbon cradle-to-site (A1–A5) terintegrasi ISO 14040 / EN 15978 dengan evaluasi rute fabrikasi (EAF, BF-BOF, H2-DRI) dan predikat LEED/GBCI Greenship Platinum.
          - **🛡️ SVD Kinematic Guard & Sherman-Morrison O(N²)**: Evaluasi perturbasi cepat rank-1 instan tanpa inversi matriks berulang.
          - **🌐 OpenBIM IFC 4.3 & CAD Triad**: Ekspor penuh ke CSI SAP2000 (.s2k), AutoCAD 3D DXF, dan IFC 4.3 dengan custom Property Set `Pset_StructuralRedundancy`.
          - **🏝️ Dynamic Island Floating AI Copilot**: Asisten cerdas floating (Cmd+K) yang tertaut langsung ke seluruh engine komputasi struktural.

          #### 📦 Download macOS Installer:
          Unduh dan buka file **EigenGraph-macOS.dmg** di bawah ini untuk menginstal di macOS (Apple Silicon M1/M2/M3/M4 & Intel x86_64).
          """
          with open("/tmp/release_notes.md", "w") as f:
              f.write(notes.strip())
          '

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Updating DMG asset and notes..."
            gh release upload "${TAG_NAME}" target/release/EigenGraph-macOS.dmg --clobber
            gh release edit "${TAG_NAME}" --notes-file /tmp/release_notes.md
          else
            echo "Creating new GitHub Release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" target/release/EigenGraph-macOS.dmg \
              --title "EigenGraph ${TAG_NAME} — Progressive Collapse, BIM 4D CPM & 6D LCA" \
              --notes-file /tmp/release_notes.md
          fi
