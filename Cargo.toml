[package]
name = "eigengraph"
version = "0.7.8"
edition = "2021"
default-run = "eigengraph"
authors = ["Harids Irawan <harids.irawan@gmail.com>"]
description = "EigenGraph — 100% Pure-Rust Vector Earth, WebGPU (WGSL), OpenBIM IFCX (IFC 5) & Structural Graph Analytics"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EigenGraph/EigenGraph"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu_no_default_features",
    "wayland",
    "x11",
] }
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false, features = [
    "fragile-send-sync-non-atomic-wasm",
    "macos-window-resize-jitter-fix",
] }
wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "webgpu",
    "metal",
    "vulkan",
    "dx12",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CloseEvent",
    "Document",
    "Element",
    "ErrorEvent",
    "Headers",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Url",
    "WebSocket",
    "Window",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "eigengraph"
path = "src/lib.rs"

[[bin]]
name = "eigengraph"
path = "src/main.rs"
